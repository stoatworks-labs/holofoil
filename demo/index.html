    <title>Holofoil — browser demo | Stoatworks Labs</title>
    <meta name="description" content="Try the Holofoil FFGL effect for Resolume in your browser: trading-card holographic foil under any clip — a holo window, a reverse holo, full foil or foil keyed by the print, embossed plain, crosshatched, with discs, in shards or as glitter — its colour worked out per pixel from a diffraction grating under a lamp. The plugin's own GLSL, ported to WebGL2 unedited, fed by a JavaScript port of its CPU half. A demo, not the plugin." />
    <link rel="icon" href="data:," />

    <main id="demo">
      <noscript>
        <p>

          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/holofoil">its repository</a>.
        </p>
      </noscript>
    </main>

    <script type="module" src="./plugin.js"></script>
