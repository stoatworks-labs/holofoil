  <body>
    <main id="demo">
      <noscript>
        <h1>Holofoil</h1>
        <p>
          An FFGL effect that treats your clip as the print on a trading card
          and puts a holographic foil under it: the holo window behind the art,
          the reverse holo round it, foil over the whole card, or foil only
          where the ink is light or dark. None of it's painted on. Every pixel
          is a little diffraction grating under a lamp, so the colours are the
          ones a grating really throws at that angle, they run through the
          spectrum as the card tips, and the ink on top filters them the way
          printing ink does.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/holofoil">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/holofoil/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/holofoil">Source on GitHub</a></li>
        </ul>
      </noscript>
